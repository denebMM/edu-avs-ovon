# docker-compose.yml - Versión corregida para que el orquestador vea los manifests

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - ofp_network
    deploy:                       # CUDA
      resources:
       limits:
        memory: 12G   
       reservations:
           memory: 8G
           devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_NUM_GPU_LAYERS=20     # no usar -1 (no cabe todo en GPU)
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=2
      - OLLAMA_NUM_THREADS=0             
  orchestrator_ollama:
    build: ./orchestrator
    container_name: orchestrator_ollama
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./schemas:/app/schemas
      - ./orchestrator/metrics:/app/metrics
    networks:
      - ofp_network

  orchestrator_manifest:
    build: ./orchestrator_manifest
    container_name: orchestrator_manifest
    ports:
      - "5004:5000"
    volumes:
      - ./schemas:/app/schemas
    depends_on:
      - assistant_physics
    networks:
      - ofp_network


  # ====================== ASISTENTE DE FÍSICA ======================
  physics-backend:
    build:
      context: ./assistants/physics-assistant/Physics-Chatbot-using-Advanced-RAG/backend
      dockerfile: Dockerfile
    container_name: physics-backend 
    command: python app.py                    
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PORT=5000                    # Puerto interno donde corre app.py
    volumes:
      - ./schemas:/app/schemas:ro
      - ./assistants/physics-assistant/Physics-Chatbot-using-Advanced-RAG/Data:/app/Data
      - ./assistants/physics-assistant/Physics-Chatbot-using-Advanced-RAG/Database:/app/Database
    networks:
      - ofp_network
    restart: unless-stopped

  assistant_physics:
    build:
      context: ./assistants/physics-assistant/Physics-Chatbot-using-Advanced-RAG/backend
      dockerfile: Dockerfile
    container_name: assistant_physics
    ports:
      - "5002:5002"
    command: python api_wrapper.py            
    environment:
      - PHYSICS_INTERNAL_URL=http://physics-backend:5000/api/generate   # ← CORREGIDO: puerto 8080
    depends_on:
      - physics-backend
    volumes:
      - ./schemas:/app/schemas:ro
    networks:
      - ofp_network
    restart: unless-stopped

  assistant_alice:
    build: ./assistants/alice-assistant
    container_name: assistant_alice
    ports:
      - "5005:5005"
    volumes:
      - ./schemas:/app/schemas
    networks:
      - ofp_network
      
  assistant_history:
    build: ./assistants/history-assistant
    container_name: assistant_history
    ports:
      - "5003:5003"
    volumes:
      - ./schemas:/app/schemas
    networks:
      - ofp_network
    restart: unless-stopped

    # ====================== TRADUCTOR (Backend + Wrapper) ======================
  translator-backend:
    build:
      context: ./assistants/translator-assistant
      dockerfile: Dockerfile
    container_name: translator-backend
    command: python api_lingonaut.py
    ports:
      - "8081:8080"  # ← AÑADE ESTO (Mapeamos el 8080 interno al 8081 externo por si acaso)
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./schemas:/app/schemas:ro
    networks:
      - ofp_network
    restart: unless-stopped

  assistant_translator:
    build:
      context: ./assistants/translator-assistant
      dockerfile: Dockerfile
    container_name: assistant_translator
    ports:
      - "5010:5010"
    # CAMBIAMOS ESTA LÍNEA: Usamos gunicorn para saltar la validación de host
    command: gunicorn --bind 0.0.0.0:5010 --timeout 180 api_wrapper:app
    environment:
      - LINGONAUT_BACKEND_URL=http://translator-backend:8080/chat
    depends_on:
      - translator-backend
    volumes:
      - ./schemas:/app/schemas:ro
    networks:
      - ofp_network
    restart: unless-stopped

# ====================== MATHBUDDY AVANZADO ======================
  mathbuddy-avanzado-backend:
    build:
      context: ./assistants/mathbuddy-avanzado-assistant/backend
      dockerfile: Dockerfile
    container_name: mathbuddy-avanzado-backend
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - API_KEY=mathbuddy-secret-key-2026
      - PORT=8080
    volumes:
      - ./schemas:/app/schemas:ro
    networks:
      - ofp_network
    restart: unless-stopped

  mathbuddy-avanzado-wrapper:
    build:
      context: ./assistants/mathbuddy-avanzado-assistant/backend
      dockerfile: Dockerfile
    container_name: mathbuddy-avanzado-wrapper
    ports:
      - "5011:5011"
    environment:
      - MATHBUDDY_API_KEY=mathbuddy-secret-key-2026
      - MATHBUDDY_INTERNAL_URL=http://mathbuddy-avanzado-backend:8080
    command: python api_wrapper.py          # ← Sobrescribimos el CMD
    depends_on:
      - mathbuddy-avanzado-backend
    volumes:
      - ./schemas:/app/schemas:ro
    networks:
      - ofp_network

# ====================== MATHBUDDY BÁSICO ======================
  mathbuddy-basico-backend:
    build:
      context: ./assistants/mathbuddy-basico-assistant/backend
      dockerfile: Dockerfile
    container_name: mathbuddy-basico-backend
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - API_KEY=mathbuddy-secret-key-2026
      - PORT=8080
    volumes:
      - ./schemas:/app/schemas:ro
    networks:
      - ofp_network
    restart: unless-stopped

  mathbuddy-basico-wrapper:
    build:
      context: ./assistants/mathbuddy-basico-assistant/backend
      dockerfile: Dockerfile
    container_name: mathbuddy-basico-wrapper
    ports:
      - "5012:5012"
    environment:
      - MATHBUDDY_API_KEY=mathbuddy-secret-key-2026
      - MATHBUDDY_INTERNAL_URL=http://mathbuddy-basico-backend:8080
    command: python api_wrapper.py
    depends_on:
      - mathbuddy-basico-backend
    volumes:
      - ./schemas:/app/schemas:ro
    networks:
      - ofp_network

networks:
  ofp_network:
    driver: bridge

volumes:
  ollama_models: